# 推 tag（v*）时构建 4 个镜像（api / worker / migrate / web）并推送到 GHCR。
#
# 产出：ghcr.io/<owner>/fin-nest-{api,worker,migrate,web}:{完整版本, 主.次, latest}
# 架构：linux/amd64 + linux/arm64（NAS、树莓派、Apple Silicon）
#
# 为什么分「按架构分别构建 → 合并 manifest」两段：
#   单 job 跑 buildx --platform=amd64,arm64 会用 QEMU 模拟 arm64，
#   而 pnpm install + Next 构建在模拟下慢 5～10 倍（web 目标可能超 40 分钟）。
#   这里改为各自跑在原生 runner 上（arm64 用 ubuntu-24.04-arm），再把两个 digest
#   合并成一个多架构 manifest，总耗时约等于单架构。
name: release-images

on:
  push:
    tags: ["v*"]
  # 允许手动触发做验证（不会打 latest，见下方 tag 规则）。
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fin-nest

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, migrate, web]
        platform:
          - { name: linux/amd64, runner: ubuntu-latest, arch: amd64 }
          - { name: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 按 digest 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform.name }}
          # NEXT_PUBLIC_* 与 API_INTERNAL_URL 在 web 构建期被烘焙进产物，运行时改无效。
          # API_INTERNAL_URL 固定为容器网络内的 http://api:4000，这也是为什么
          # docker-compose.yml 里 API 服务必须叫 `api`。
          # 四个 target 共用同一个 build 阶段，故所有 target 传相同 build-args 以复用缓存。
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
            NEXT_PUBLIC_ENABLE_DEV_UI=false
            API_INTERNAL_URL=http://api:4000
          # push-by-digest：先只推送不带 tag 的镜像层，tag 留到 merge 阶段统一打，
          # 避免两个架构互相覆盖同一个 tag。
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform.arch }}

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.platform.arch }}-${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, migrate, web]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.target }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target }}
          # 注意：{{version}} 会剥掉 git tag 的 v 前缀——git tag `v1.2.0` 产出镜像 tag `1.2.0`。
          # 故 .env.docker 里 FIN_NEST_VERSION 要写 `1.2.0`（不带 v），文档已按此说明。
          # 预发布 tag（含 '-'，如 v1.2.0-rc.1）不动 latest，避免把用户升到测试版。
          # 最后一条兜底：workflow_dispatch 手动触发时没有 semver tag，
          # 若一个 tag 都产不出，下一步 imagetools create 会因缺 -t 直接失败。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=dev-{{sha}},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 合并为多架构 manifest
        working-directory: /tmp/digests
        run: |
          # 文件名形如 amd64-<digest>，取 '-' 之后的部分还原成 sha256:<digest>
          refs=""
          for f in *; do
            refs="$refs ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target }}@sha256:${f#*-}"
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $refs

      - name: 输出结果
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ steps.meta.outputs.version }}"
