# 本地开发依赖：PostgreSQL + MinIO（v1 不含 Redis）。
# 用法：pnpm infra:up（需先复制 .env.example 为 .env）。
services:
  postgres:
    image: postgres:17-alpine
    container_name: fin-nest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finnest}
      POSTGRES_DB: ${POSTGRES_DB:-finnest}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finnest} -d ${POSTGRES_DB:-finnest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fin-nest-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一次性初始化：创建私有 bucket（默认不公开访问，权限由 API 控制）。
  minio-init:
    image: minio/mc:latest
    container_name: fin-nest-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-fin-nest} &&
      mc anonymous set none local/${MINIO_BUCKET:-fin-nest} &&
      echo 'minio bucket ready: ${MINIO_BUCKET:-fin-nest}'
      "
    restart: "no"

volumes:
  pgdata:
  miniodata:
