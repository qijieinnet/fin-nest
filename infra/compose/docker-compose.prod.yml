# Fin Nest 生产/自托管整栈编排：PostgreSQL + MinIO + 迁移 + api + worker + web。
#
# 用法（在仓库根目录）：
#   cp .env.docker.example .env.docker   # 按需修改密码 / 域名
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.docker up -d --build
#   浏览器访问 http://<host>:4001
#
# 数据安全：
#   - postgres 数据存于命名卷 pgdata，`down` 不会删除（除非显式 `down -v`）。
#   - 迁移只用 `prisma migrate deploy`（migrate 服务），仅应用未执行的迁移，绝不重置/清空已有数据。
#
# 使用外部数据库 / 对象存储：
#   在 .env.docker 中设 COMPOSE_PROFILES= （置空，不启用 bundled），
#   并把 DATABASE_URL / MINIO_* 指向外部地址即可；此时不会启动内置 postgres / minio。

# 固定项目名，确保数据卷名（fin-nest_pgdata 等）稳定，不随执行目录变化。
name: fin-nest

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4001}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  # 应用锁 Face ID 的 WebAuthn RP ID，留空则取 WEB_ORIGIN 第一项的 hostname；
  # WEB_ORIGIN 配了多个不同域名时才需要显式指定，改动会让已注册凭证全部失效。
  APP_LOCK_RP_ID: ${APP_LOCK_RP_ID:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
  MINIO_PORT: ${MINIO_PORT:-9000}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-fin-nest}
  # AI 助手（可选）：三者都配置时启用，未配置则相关端点返回未启用、前端隐藏入口。
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  # 飞书机器人（可选）：两者需同时配置，只配一半会启动报错。
  FEISHU_APP_ID: ${FEISHU_APP_ID:-}
  FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    container_name: fin-nest-postgres
    profiles: ["bundled"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finnest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finnest}
      POSTGRES_DB: ${POSTGRES_DB:-finnest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finnest} -d ${POSTGRES_DB:-finnest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fin-nest-minio
    profiles: ["bundled"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一次性初始化：创建私有 bucket（默认不公开，权限由 API 控制）。
  minio-init:
    image: minio/mc:latest
    container_name: fin-nest-minio-init
    profiles: ["bundled"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-fin-nest} &&
      mc anonymous set none local/${MINIO_BUCKET:-fin-nest} &&
      echo 'minio bucket ready: ${MINIO_BUCKET:-fin-nest}'
      "
    restart: "no"

  # 一次性迁移：应用未执行的数据库迁移后退出。绝不清空已有数据。
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrate
    image: fin-nest-migrate:latest
    container_name: fin-nest-migrate
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    image: fin-nest-api:latest
    container_name: fin-nest-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      <<: *app-env
      API_PORT: "4000"
    # 默认只绑本机回环，对外只暴露 web（4001）一个端口。
    # web 容器走 docker 网络访问 api，不依赖这个发布端口；发布到 127.0.0.1 仅为
    # 宿主机 curl 调试 / 前置 nginx 反代 /api。确需跨机直连才设 API_EXPOSE_BIND=0.0.0.0，
    # 此时 API 直接对外，必须保持 TRUST_PROXY=false，否则 XFF 可伪造、登录限速被绕过。
    ports:
      - "${API_EXPOSE_BIND:-127.0.0.1}:${API_EXPOSE_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    image: fin-nest-worker:latest
    container_name: fin-nest-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      <<: *app-env
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-30000}

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
      args:
        # 以下均为构建期烘焙，改动需重新 build web 镜像。
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_ENABLE_DEV_UI: ${NEXT_PUBLIC_ENABLE_DEV_UI:-false}
        # Next 转发 /api 的目标（rewrite 目标在构建期确定）。
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    image: fin-nest-web:latest
    container_name: fin-nest-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: "4001"
      HOSTNAME: "0.0.0.0"
      # 浏览器请求 /api 时，Next 在容器网络内转发到 api 服务。
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    ports:
      - "${WEB_PORT:-4001}:4001"

volumes:
  pgdata:
  miniodata:
